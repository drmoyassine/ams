services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ams}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    # S3-compatible object storage (Garage). Pinned: the admin API used by scripts/garage-init.mjs is v1.
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
      # The healthcheck below opens an RPC connection each run; keep those handshakes out of the logs.
      RUST_LOG: garage=info,garage_net=warn
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  garage-init:
    image: node:22-slim
    depends_on:
      garage: { condition: service_healthy }
    environment:
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_BUCKET: ${S3_BUCKET:-ams}
    volumes: [./scripts/garage-init.mjs:/init.mjs:ro]
    command: ["node", "/init.mjs"]
    restart: "no"

  app:
    build: { context: ., target: app }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: worker }
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      garage-init: { condition: service_completed_successfully }

volumes:
  pgdata:
  garagemeta:
  garagedata:
