services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ams}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ams}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  garage:
    # S3-compatible object storage (Garage). Pinned: the admin API the app's startup bootstrap uses is v1.
    image: dxflrs/garage:v1.0.1
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?set GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
      # The healthcheck below opens an RPC connection each run; keep those handshakes out of the logs.
      RUST_LOG: garage=info,garage_net=warn
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garagemeta:/var/lib/garage/meta
      - garagedata:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 10s

  app:
    build: { context: ., target: app }
    env_file: .env
    environment:
      # The app prepares Garage itself before it serves (layout, S3 key, bucket, grant; packages/core garage-bootstrap).
      # Leave GARAGE_ADMIN_URL out on any other S3 host (AWS S3, MinIO ...): nothing is then bootstrapped.
      GARAGE_ADMIN_URL: http://garage:3903
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?set GARAGE_ADMIN_TOKEN}
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_healthy }

  # ---- Background work: three services from one image definition and one entry point (apps/worker/dist/main.js) ----
  # They differ only in WORKER_QUEUES (the job types each takes; the table is QUEUE_GROUPS in packages/shared, and a test
  # checks these values against it). They start only once the app is healthy: the app migrates the database and creates
  # the bucket before it serves, so by then both exist. (DEC-024)
  #
  # Network: only `agent` needs outbound internet (AI providers, embeddings). `app`, `parser` and `worker` need only
  # postgres and garage. Nothing is restricted here, so this runs unchanged on Easypanel; restrict egress for the others
  # on your host if you want to. The AI_* / *_API_KEY variables are read by `agent` (and by `parser` only for the
  # optional OCR of scanned pages, which falls back to "needs OCR" when it cannot reach a provider); `app` and `worker`
  # never need them.

  worker:
    # General work: export, notify. Needs neither document parsing nor a model.
    build: { context: ., target: worker }
    env_file: .env
    environment:
      WORKER_NAME: worker
      WORKER_QUEUES: export,notify
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_healthy }
      app: { condition: service_healthy }

  parser:
    # Document reading (extract_text): CPU and memory heavy, so it is its own service and can be sized on its own.
    build: { context: ., target: parser }
    env_file: .env
    environment:
      WORKER_NAME: parser
      WORKER_QUEUES: extract_text
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_healthy }
      app: { condition: service_healthy }

  agent:
    # Everything that calls an AI model: framework analysis steps, and future mapping and report jobs. It parses no
    # documents: a source without page text is queued to `parser` and the analysis waits for it.
    # This is the only service that needs outbound internet.
    build: { context: ., target: agent }
    env_file: .env
    environment:
      WORKER_NAME: agent
      WORKER_QUEUES: analyse,ai_extract,ocr
    depends_on:
      postgres: { condition: service_healthy }
      garage: { condition: service_healthy }
      app: { condition: service_healthy }

volumes:
  pgdata:
  garagemeta:
  garagedata:
